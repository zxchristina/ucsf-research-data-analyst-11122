name: Synthetic QA Pipeline Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.sata_demo.generate --output data/raw
      - run: python -m src.sata_demo.pipeline --input data/raw --output outputs
      - run: python -m pytest -q
