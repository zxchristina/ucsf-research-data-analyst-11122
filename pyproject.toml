[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "service-ops-reliability"
version = "0.1.0"
description = "Reproducible service operations data-quality audits and demand forecasting"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
